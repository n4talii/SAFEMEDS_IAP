openapi: 3.0.0
info:
  title: SafeMeds & MajiApp Integration API
  version: 1.0.0
  description: API contract for water purification inventory, product reviews, customer orders, and health alert signals. Protected via API keys and rate limiting.

# All endpoints need to have api key authentication.
security:
  - ApiKeyAuth: []

paths:
  /tasks:
    get:
      summary: Protected connectivity check
      description: Verifies server reachability and API key authorization without touching database records.
      responses:
        '200':
          description: Connectivity check successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Success! You accessed a protected endpoint."
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'

  /inventory:
    get:
      summary: Retrieve available water-purification inventory products
      description: Returns items in the Water Purification category with availability status.
      parameters:
        - name: product
          in: query
          required: false
          schema:
            type: string
            example: "Aquatabs"
        - name: available
          in: query
          required: false
          schema:
            type: boolean
            example: true
      responses:
        '200':
          description: A list of matching inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - productId
                    - productName
                    - availableQuantity
                    - isAvailable
                  properties:
                    productId:
                      type: integer
                      example: 1
                    productName:
                      type: string
                      example: "Aquatabs"
                    availableQuantity:
                      type: integer
                      example: 450
                    isAvailable:
                      type: boolean
                      example: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'

  /reviews:
    get:
      summary: Retrieve top-ranked water purification products by rating
      description: Returns top 3 water-purification products ranked by customer review score.
      responses:
        '200':
          description: List of top rated products
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - productId
                    - productName
                    - averageRating
                    - reviewCount
                  properties:
                    productId:
                      type: integer
                      example: 1
                    productName:
                      type: string
                      example: "Aquatabs"
                    averageRating:
                      type: number
                      format: float
                      example: 4.8
                    reviewCount:
                      type: integer
                      example: 25
                    topComment:
                      type: string
                      example: "Very effective and convenient for clean drinking water."
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'

  /orders:
    post:
      summary: Create a new customer order
      description: Submits a new water purification product order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productId
                - quantity
                - customerName
              properties:
                productId:
                  type: integer
                  example: 17
                quantity:
                  type: integer
                  example: 5
                customerName:
                  type: string
                  example: "Nairobi Relief Clinic"
      responses:
        '201':
          description: Order placed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Order placed successfully"
                  orderId:
                    type: integer
                    example: 101
                  productId:
                    type: integer
                    example: 17
                  quantity:
                    type: integer
                    example: 5
                  customerName:
                    type: string
                    example: "Nairobi Relief Clinic"
                  status:
                    type: string
                    example: "Pending"
                  createdAt:
                    type: string
                    format: date-time
                    example: "2026-10-30T08:00:00Z"
        '400':
          description: Bad payload request (invalid parameters)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid payload. 'quantity' must be a positive integer greater than 0."
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'

  /v1/health-signals/area-alerts:
    get:
      summary: Retrieve active waterborne illness spike alerts for a region
      parameters:
        - name: region
          in: query
          required: true
          schema:
            type: string
            example: "Nairobi-Central"
        - name: since
          in: query
          required: true
          schema:
            type: string
            format: date
            example: "2026-10-29"
      responses:
        '200':
          description: Anonymized aggregate health signal alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    region:
                      type: string
                      example: "Nairobi-Central"
                    illnessCategory:
                      type: string
                      example: "Cholera"
                    signalMode:
                      type: string
                      example: "demo"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key required for authorization. Pass in the `X-API-Key` header.

  responses:
    UnauthorizedError:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Missing or invalid API key"

    RateLimitError:
      description: Rate limit exceeded (more than 100 requests per 60 seconds)
      headers:
        Retry-After:
          schema:
            type: string
          description: Time in seconds to wait before making another request
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Too many requests"
              retryAfter:
                type: integer
                example: 45